# Unique across all of GitBook ("code-walkthrough" is taken).
name: apwt-code-walkthrough
title: Code Walkthrough
description: Embed narrated code walkthrough lessons (typing editor, subtitles, live preview) in GitBook pages.
script: ./src/index.tsx
# icon: ./assets/icon.png
scopes: []
# GitBook organization ID or subdomain (the "apwt" in apwt.gitbook.io).
organization: apwt
# private: only your organization can install it. "unlisted" and "public" also exist.
visibility: private

configurations:
  account:
    properties:
      player_url:
        type: string
        title: Player URL
        description: Folder where code-walkthrough is hosted, ending in /
    required:
      - player_url

blocks:
  - id: walkthrough
    title: Code walkthrough
    description: A narrated code lesson with a typing editor and live preview.
    # Pasting a link that matches turns it into the block:
    # .../embed.html?lesson=<id>&lang=<lang> or .../index.html#<id>
    urlUnfurl:
      - https://teacher-svb.github.io/widget-test/code-walkthrough/**
