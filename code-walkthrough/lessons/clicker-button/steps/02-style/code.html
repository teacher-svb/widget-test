<!doctype html>
<html>
<head>
  <title>Click counter</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .counter { text-align: center; }
    #count {
      display: block;
      font-size: 4rem;
      font-weight: 700;
    }
    button {
      font: inherit;
      padding: 0.6em 1.4em;
      border: 0;
      border-radius: 999px;
      background: #2b54cf;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="counter">
    <p class="label">Clicks</p>
    <output id="count">0</output>
    <button id="add">Click me</button>
  </main>
</body>
</html>
